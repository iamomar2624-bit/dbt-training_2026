version: 2

sources:
  - name: globalmart
    database: raw
    schema: globalmart
    description: a clone of the Snowflake database

    tables:
      - name: customer

      - name: orders
        description: raw order table
        columns:
          - name: orderid
            description: primary key for orders
            tests:
              - unique
              - not_null

      - name: product